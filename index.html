<!DOCTYPE html>
<html>
<head>
    <title>Lista de Tarefas</title>
<style>
   body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1f2937, #111827);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

    input {
    padding: 12px;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #d1d5db;
    border-radius: 10px;
}

input:focus {
    outline: none;
    border-color: #2563eb;
}

button {
    padding: 12px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    opacity: 0.9;
    transform: translateY(-1px);
}

button:active {
    transform: scale(0.97);
}

   ul {
       list-style: none;
       padding: 0;
    }

   li {
       background: white;
       margin: 5px;
       padding: 10px;

       display: flex;
       justify-content: space-between;
       align-items: center;    
}
 
   .container {
    background: white;
    padding: 25px;
    border-radius: 16px;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

.form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

li button:first-of-type {
    background: orange;
}

li button:last-of-type {
    background: red;
}   

li div {
    display: flex;
    gap: 5px;
}

li:hover {
    transform: scale(1.02);
    transition: 0.2s;
    background: #eef2ff;
    transform: translateY(-1px);
}

.concluida .texto-tarefa {
    text-decoration: line-through;
    color: gray;
}

.ativo {
    background: black;
    color: white;
}

.texto-tarefa {
    transition: all 0.3s ease;
}

.concluida .texto-tarefa {
    text-decoration: line-through;
    color: gray;
    opacity: 0.6;
}



.filtros {
    display: flex;
    gap: 8px;
}

.filtros button {
    background: #ddd;
    color: #333;
}

.filtros button.ativo {
    background: #222;
    color: white;
}

li {
    background: #f9fafb;
    margin: 8px 0;
    padding: 12px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    animation: aparecer 0.3s ease;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(-8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

#mensagem {
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    min-height: 20px;
    opacity: 0;
    transform: translateY(-5px);
    transition: 0.3s;
}

.sucesso {
    color: green;
}

.erro {
    color: red;
}

#mensagem.show {
    opacity: 1;
    transform: translateY(0);
}

.checkbox {
    accent-color: #2563eb;
    cursor: pointer;
}

  </style>
</head>
<body>

<div class="container">
    <h1>Cadastro de Tarefas</h1>

   <div class="form">
    <input id="tarefa" placeholder="Digite uma tarefa">
    <button id="btnCadastrar">Cadastrar</button>
<p id="mensagem"></p>
</div>

    <h2>Lista de Tarefas</h2>

<div class="filtros">
    <button id="filtroTodas" class="ativo">Todas</button>
    <button id="filtroConcluidas">Concluídas</button>
    <button id="filtroPendentes">Pendentes</button>
</div>

    <ul id="lista"></ul>


    <script src="script.js"></script>

</body>
</html>
